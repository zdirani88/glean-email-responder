<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Glean Email Responder Options</title>
    <style>
      body {
        background: #f6f8fb;
        color: #202124;
        font: 14px/1.45 Arial, sans-serif;
        margin: 32px;
        max-width: 640px;
      }
      label {
        display: block;
        font-weight: 700;
        margin-top: 18px;
      }
      input {
        border: 1px solid #dfe3ea;
        border-radius: 8px;
        box-sizing: border-box;
        font: inherit;
        margin-top: 6px;
        padding: 8px;
        width: 100%;
      }
      button {
        background: #1a73e8;
        border: 0;
        border-radius: 4px;
        color: white;
        cursor: pointer;
        font: inherit;
        margin-top: 18px;
        padding: 8px 12px;
      }
      #status {
        margin-left: 12px;
      }
    </style>
  </head>
  <body>
    <h1>Glean Email Responder</h1>
    <p>Shortcut: Cmd+Shift+Y on Mac, Ctrl+Shift+Y on Windows.</p>
    <label>
      Backend base URL
      <input id="backendBaseUrl" />
    </label>
    <label>
      Backend shared secret
      <input id="backendSecret" type="password" placeholder="Pair from the helper app" />
    </label>
    <button id="save">Save</button><span id="status"></span>
    <script src="options.js"></script>
  </body>
</html>
