name: Build Mac Helper

on:
  workflow_dispatch:
  push:
    tags:
      - "helper-v*"

jobs:
  build-mac-helper:
    name: Build Mac helper DMG
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Build helper DMG
        run: npm run package:helper:mac

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: gmail-glean-helper-mac-dmg
          path: helper-app/dist/*.dmg
          if-no-files-found: error

      - name: Attach DMG to GitHub release
        if: startsWith(github.ref, 'refs/tags/helper-v')
        uses: softprops/action-gh-release@v2
        with:
          files: helper-app/dist/*.dmg
